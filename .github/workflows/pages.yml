# The website, https://opengp5.github.io/OpenGP5/: the docs (Hugo + Docsy, site/), the web flasher (docs/flasher/)
# and the firmware catalog's index (docs/catalog.json), built and published on every push that changes them.
# Repository settings: Pages > Source: GitHub Actions.
name: pages
on:
  push:
    branches: [main]
    paths: [site/**, docs/**, CHANGELOG.md, BETA-TESTING.md, CONTRIBUTING.md, CODE_OF_CONDUCT.md, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  HUGO_VERSION: 0.170.1
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Hugo (extended)
        run: |
          curl -sSLo hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb && hugo version
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          PATH="$PWD/node_modules/.bin:$PATH" hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Every link on the site
        run: python3 site/check_links.py site/public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
